name: Windows Desktop Release

on:
  workflow_dispatch:
  push:
    branches:
      - "desktop-release-preview"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e ".[cad,gui,dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "pyinstaller>=6.12"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          exit 0

      - name: Install OpenSCAD and Inno Setup
        shell: pwsh
        run: |
          choco install openscad -y --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010)) { exit $LASTEXITCODE }
          exit 0

      - name: Run tests
        shell: pwsh
        run: |
          python -m pytest -q
          $testExit = $LASTEXITCODE
          Write-Host "pytest exit code: $testExit"
          exit $testExit

      - name: Smoke-test desktop window
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from embossforge.gui import MainWindow; app=QApplication([]); w=MainWindow(); assert w.windowTitle() == 'EmbossForge'; print('desktop window OK')"
          exit $LASTEXITCODE

      - name: Build portable desktop app
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name EmbossForge `
            --hidden-import cv2 `
            packaging/desktop_entry.py
          exit $LASTEXITCODE

      - name: Bundle OpenSCAD and notices
        shell: pwsh
        run: |
          $openScadExe = Get-ChildItem "C:\Program Files" -Filter openscad.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $openScadExe) {
            $openScadExe = Get-ChildItem "C:\Program Files (x86)" -Filter openscad.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $openScadExe) { throw "Could not locate OpenSCAD after installation" }

          $toolDir = "dist\EmbossForge\tools\openscad"
          New-Item -ItemType Directory -Force -Path $toolDir | Out-Null
          Copy-Item (Join-Path $openScadExe.Directory.FullName "*") $toolDir -Recurse -Force
          Copy-Item LICENSE "dist\EmbossForge\LICENSE.txt"
          Copy-Item THIRD_PARTY_NOTICES.md "dist\EmbossForge\THIRD_PARTY_NOTICES.md"
          Copy-Item README.md "dist\EmbossForge\README.md"

      - name: Verify portable bundle
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\EmbossForge\EmbossForge.exe")) {
            throw "Portable bundle is missing EmbossForge.exe"
          }
          if (-not (Test-Path "dist\EmbossForge\tools\openscad\openscad.exe")) {
            throw "Portable bundle is missing OpenSCAD"
          }

      - name: Create portable ZIP
        shell: pwsh
        run: |
          $zip = "dist\EmbossForge-Windows-x64-portable.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist\EmbossForge\*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "packaging\windows\EmbossForge.iss"
          exit $LASTEXITCODE

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EmbossForge-Windows-x64
          path: |
            dist/EmbossForge-Windows-x64-portable.zip
            dist/installer/EmbossForge-Setup-Windows-x64.exe
          if-no-files-found: error

      - name: Attach assets to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/EmbossForge-Windows-x64-portable.zip
            dist/installer/EmbossForge-Setup-Windows-x64.exe
