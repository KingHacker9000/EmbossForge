name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Install EmbossForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad,dev]"

      - name: Compile Python sources
        run: python -m compileall -q embossforge

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: |
          embossforge --version
          embossforge doctor
          embossforge butterfly-test --out build/ci-butterfly

  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q embossforge

      - name: Construct desktop window offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from embossforge.gui import MainWindow; app=QApplication([]); w=MainWindow(); assert w.windowTitle() == 'EmbossForge'; assert not w.generate_button.isEnabled(); print('desktop smoke OK')"
