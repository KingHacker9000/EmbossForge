name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad

      - name: Install EmbossForge
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[cad,dev]"

      - name: Compile Python sources
        run: python -m compileall -q embossforge

      - name: Run tests
        run: pytest -q

      - name: Binary CLI smoke test
        run: |
          embossforge --version
          embossforge doctor
          embossforge butterfly-test --out build/ci-butterfly

      - name: Primary handheld lever press smoke test
        run: |
          embossforge lever-press --out build/ci-lever-press
          test -s build/ci-lever-press/body.stl
          test -s build/ci-lever-press/upper_carriage.stl
          test -s build/ci-lever-press/upper_backing_cap.stl
          test -s build/ci-lever-press/lever.stl
          test -s build/ci-lever-press/lever_press_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/ci-lever-press/lever_press_manifest.json").read_text())
          assert manifest["mode"] == "full-size-handheld-lever-embosser-v2"
          assert manifest["exact_die_contract_mm"]["diameter"] == 42.0
          assert manifest["derived"]["nominal_lever_ratio"] > 6.5
          assert manifest["collision_validation"] == {"closed": [], "open": []}
          print("handheld lever press smoke OK")
          PY

      - name: Butterfly micro-tongs smoke test
        run: |
          embossforge micro-press --out build/ci-micro-press
          test -s build/ci-micro-press/micro_butterfly_tongs.stl
          test -s build/ci-micro-press/micro_butterfly_tongs.step
          test -s build/ci-micro-press/micro_press_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/ci-micro-press/micro_press_manifest.json").read_text())
          assert manifest["mode"] == "micro-butterfly-flexure-tongs"
          assert manifest["exact_die_contract_mm"]["diameter"] == 16.0
          assert manifest["derived"]["solid_pla_mass_upper_bound_g"] < 8.0
          print("micro flexure tongs smoke OK")
          PY

      - name: Variable-depth relief STL smoke test
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2
          import numpy as np

          out = Path("build")
          out.mkdir(exist_ok=True)
          image = np.full((96, 96), 255, dtype=np.uint8)
          cv2.circle(image, (48, 48), 30, 96, -1)
          cv2.circle(image, (48, 48), 18, 24, -1)
          assert cv2.imwrite(str(out / "ci-heightmap.png"), image)
          PY
          embossforge die build/ci-heightmap.png \
            --out build/ci-relief \
            --name relief-smoke \
            --mode relief \
            --source-interpretation height-map \
            --relief-max 0.30 \
            --relief-style stepped \
            --relief-levels 4 \
            --relief-quality draft \
            --paper copy \
            --profile profiles/flashforge_adventurer_5m.toml \
            --allow-risky
          test -s build/ci-relief/relief-smoke/relief-smoke_male.stl
          test -s build/ci-relief/relief-smoke/relief-smoke_female.stl
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("build/ci-relief/relief-smoke/relief-smoke_manifest.json").read_text())
          assert manifest["schema_version"] == 2
          assert manifest["relief"]["mode"] == "relief"
          assert "exported-stl-closure" in manifest["validation"]["verification_level"]
          print("relief STL + closure smoke OK")
          PY

  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q embossforge

      - name: Construct vNext desktop window offscreen
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          python -c "from PySide6.QtWidgets import QApplication; from embossforge.gui_vnext import MainWindow; app=QApplication([]); w=MainWindow(); assert w.windowTitle() == 'EmbossForge'; assert not w.generate_button.isEnabled(); assert w.source_interpretation.count() >= 2; print('vNext desktop smoke OK')"
