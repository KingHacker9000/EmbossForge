[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embossforge"
version = "0.2.0"
description = "Open-source parametric embosser and automatic interchangeable die generator for 3D printing."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "EmbossForge contributors"}]
keywords = ["3d-printing", "embossing", "cad", "cadquery", "openscad", "maker"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: Developers",
  "Intended Audience :: Manufacturing",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.optional-dependencies]
cad = ["cadquery>=2.4"]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8"]
release = [
  "PySide6>=6.8,<7",
  "pyinstaller>=6.12",
]

[project.scripts]
embossforge = "embossforge.cli_vnext:main"

[project.gui-scripts]
embossforge-gui = "embossforge.gui_vnext:main"

[project.urls]
Homepage = "https://github.com/KingHacker9000/EmbossForge"
Repository = "https://github.com/KingHacker9000/EmbossForge"
Issues = "https://github.com/KingHacker9000/EmbossForge/issues"
Changelog = "https://github.com/KingHacker9000/EmbossForge/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["embossforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
